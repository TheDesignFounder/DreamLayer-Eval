[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamlayer-research"
dynamic = ["version", "dependencies"]
description = "Local reproducible image and video evaluation workbench"
readme = "README.md"
requires-python = ">=3.11,<3.13"

[project.scripts]
dreamlayer-research = "research.__main__:main"

[tool.setuptools]
packages = ["research", "research.schemas"]

[tool.setuptools.dynamic]
version = {attr = "research.__version__"}
dependencies = {file = ["requirements-research.txt"]}

[tool.setuptools.package-data]
research = ["schemas/*.json", "py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["ComfyUI", "dream_layer_backend", "dream_layer_frontend", ".research", ".venv*", "dist"]
include = ["research/**/*.py", "tests/research/**/*.py", "scripts/research_*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/research_*.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true
